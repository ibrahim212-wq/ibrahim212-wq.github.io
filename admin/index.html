// ── dates (Cairo) ───────────────────────────────────────────────────────────────────────────────────────────────
function cairoToday() {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Africa/Cairo", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
  const g = (t) => p.find((x) => x.type === t).value;
  return `${g("year")}-${g("month")}-${g("day")}`;
}
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dayDiff = (a, b) => Math.round((Date.parse(b + "T12:00:00Z") - Date.parse(a + "T12:00:00Z")) / 86400e3);
const fmtDay = (iso, opt = { day: "numeric", month: "short" }) => new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { ...opt, timeZone: "UTC" });
const fmtDayLong = (iso) => new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
function resolveRange() {
  const today = (S.data && S.data.today) || cairoToday();
  const first = S.data && S.data.records && S.data.records.first_day;
  switch (S.range) {
    case "today": return [today, today];
    case "7d": return [addDays(today, -6), today];
    case "30d": return [addDays(today, -29), today];
    case "90d": return [addDays(today, -89), today];
    case "all": return [first && first < today ? (dayDiff(first, today) > 800 ? addDays(today, -800) : first) : addDays(today, -29), today];
    case "custom": {
      const a = S.customFrom || addDays(today, -29), b = S.customTo || today;
      return a <= b ? [a, b] : [b, a];
    }
  }
  return [addDays(today, -29), today];
}
const RANGE_LABEL = { today: "Today", "7d": "7 days", "30d": "30 days", "90d": "90 days", all: "All time", custom: "Custom" };

const nf = new Intl.NumberFormat("en-US");
const fmt = (n) => (n == null || Number.isNaN(n) ? "—" : nf.format(Math.round(n)));
const pct = (a, b) => (b > 0 ? (100 * a) / b : null);
const fmtPct = (p, d = 0) => (p == null ? "—" : (Math.round(p * 10 ** d) / 10 ** d).toFixed(d) + "%");
function delta(cur, prev) {
  if (cur == null || prev == null) return null;
  if (prev === 0) return cur === 0 ? null : { cls: "up", txt: "new" };
  const d = (100 * (cur - prev)) / prev;
  if (Math.abs(d) < 0.5) return { cls: "flat", txt: "0%" };
  return { cls: d > 0 ? "up" : "down", txt: (d > 0 ? "+" : "−") + (Math.abs(d) >= 10 ? Math.round(Math.abs(d)) : Math.abs(d).toFixed(1)) + "%" };
}
const ARROW = { up: '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5v-7M3 5.5l3-3 3 3"/></svg>',

const deltaHtml = (dl) => (dl ? `<span class="delta ${dl.cls}">${dl.txt !== "new" && ARROW[dl.cls] ? ARROW[dl.cls] : ""}${dl.txt.replace(/^[+−]/, "")}</span>` : "");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ── API ─────────────────────────────────────────────────────────────────────────────────────────────────────────
async function rpc(fn, args) {
  const r = await fetch(`${CONFIG.api}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: CONFIG.key, Authorization: `Bearer ${CONFIG.key}` },
    body: JSON.stringify(args), cache: "no-store",
  });
  if (r.status === 404) throw Object.assign(new Error("missing"), { missing: true });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ── count-up ────────────────────────────────────────────────────────────────────────────────────────────────────
function countUp(root) {
  root.querySelectorAll("[data-count]").forEach((el) => {
    const to = Number(el.dataset.count), dec = Number(el.dataset.dec || 0), suffix = el.dataset.suffix || "";
    const show = (v) => (el.firstChild ? (el.firstChild.nodeValue = (dec ? v.toFixed(dec) : nf.format(Math.round(v))) + suffix) : null);
    if (reduced || !Number.isFinite(to) || to === 0) { show(to || 0); return; }
    const t0 = performance.now(), dur = 900;
    const step = (t) => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); show(to * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
const countSpan = (n, dec = 0, suffix = "") => `<span class="num" data-count="${n ?? 0}" data-dec="${dec}" data-suffix="${suffix}">${dec ? (n ?? 0).toFixed(dec) : fmt(n ?? 0)}${suffix}</span>`;

let gid = 0;
function niceMax(v) { if (v <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }

  const mx = Math.max(1, ...values), pts = values.map((v, i) => [(i / (n - 1)) * w, h - 3 - (v / mx) * (h - 8)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="var(--grad-a)"/><stop offset="1" stop-color="var(--grad-b)"/></linearGradient>
    <linearGradient id="${id}f" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--grad-a)" stop-opacity=".16"/><stop offset="1" stop-color="var(--grad-a)" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id}f)"/><path class="draw" d="${d}" fill="none" stroke="url(#${id})" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* A line / bar chart with an interactive crosshair. series: [{key,label,color,values,type:'line'|'bar'}] */
function timeChart(el, days, series, opts = {}) {
  const H = opts.height || 240, padL = 34, padR = 10, padT = 10, padB = 26;
  el.innerHTML = "";
  const W = Math.max(280, el.clientWidth || 600);
  const shown = series.filter((s) => s.values && s.values.length);
  const all = shown.flatMap((s) => s.values);
  const total = all.reduce((a, b) => a + b, 0);
  const max = niceMax(Math.max(1, ...all));
  const n = days.length, iw = W - padL - padR, ih = H - padT - padB;
  const X = (i) => padL + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
  const Y = (v) => padT + ih - (v / max) * ih;
  const id = "tc" + ++gid;
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opts.label || "chart")}"><defs>
    <linearGradient id="${id}s" x1="0" x2="1"><stop offset="0" stop-color="var(--grad-a)"/><stop offset="1" stop-color="var(--grad-b)"/></linearGradient>
    <linearGradient id="${id}f" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--grad-a)" stop-opacity=".18"/><stop offset="1" stop-color="var(--grad-a)" stop-opacity="0"/></linearGradient></defs>`;
  for (let k = 0; k <= 4; k++) {
    const v = (max / 4) * k, y = Y(v);
    svg += `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" ${k ? 'stroke-dasharray="2 4"' : ""}/>`;
    svg += `<text class="axis" x="${padL - 8}" y="${y + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  const ticks = Math.min(n, Math.max(2, Math.floor(iw / 78)));
  for (let k = 0; k < ticks; k++) {
    const i = n === 1 ? 0 : Math.round((k / Math.max(1, ticks - 1)) * (n - 1));
    svg += `<text class="axis" x="${X(i)}" y="${H - 6}" text-anchor="${n === 1 ? "middle" : k === 0 ? "start" : k === ticks - 1 ? "end" : "middle"}">${fmtDay(days[i])}</text>`;
  }
  const bw = Math.max(2, Math.min(18, (iw / Math.max(1, n)) * 0.55));
  shown.forEach((s, si) => {
    if (s.type === "bar" || n === 1) {
      const nb = shown.length, off = n === 1 ? (si - (nb - 1) / 2) * (bw + 6) : 0;
      s.values.forEach((v, i) => {
        if (v <= 0) return;
        const x = X(i) - bw / 2 + off, y = Y(v);
        svg += `<rect class="grow" x="${x}" y="${y}" width="${bw}" height="${Math.max(1, padT + ih - y)}" rx="${Math.min(4, bw / 2)}" fill="${s.color === "grad" ? `url(#${id}s)` : s.color}" opacity="${s.type === "bar" ? 0.55 : 0.9}"/>`;
      });
      return;
    }
    const pts = s.values.map((v, i) => [X(i), Y(v)]);
    let d = "";
    pts.forEach((p, i) => {
      if (!i) { d += `M${p[0]} ${p[1]}`; return; }
      const p0 = pts[i - 1], cx = (p0[0] + p[0]) / 2;
      d += ` C${cx} ${p0[1]} ${cx} ${p[1]} ${p[0]} ${p[1]}`;
    });
    if (si === 0 && s.color === "grad") svg += `<path d="${d} L${pts[n - 1][0]} ${padT + ih} L${pts[0][0]} ${padT + ih} Z" fill="url(#${id}f)" class="fadein"/>`;
    svg += `<path class="draw" d="${d}" fill="none" stroke="${s.color === "grad" ? `url(#${id}s)` : s.color}" stroke-width="${s.color === "grad" ? 2.4 : 1.8}" ${s.dash ? 'stroke-dasharray="4 4"' : ""} stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  svg += `<line class="xh" x1="0" x2="0" y1="${padT}" y2="${padT + ih}" stroke="var(--faint)" stroke-dasharray="3 3" opacity="0"/>`;
  shown.forEach((s, si) => { if (s.type !== "bar" && n > 1) svg += `<circle class="xd" data-i="${si}" r="4.2" cx="0" cy="0" fill="var(--surface)" stroke="${s.color === "grad" ? "var(--grad-a)" : s.color}" stroke-width="2.2" opacity="0"/>`; });
  svg += `<rect x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg>`;
  el.insertAdjacentHTML("beforeend", svg);
  if (total === 0) el.insertAdjacentHTML("beforeend", `<div class="empty" style="position:absolute;inset:${padT}px ${padR}px ${padB}px ${padL}px;display:grid;place-items:center"><div><b>${esc(opts.emptyTitle || "Nothing in this range yet")}</b>${esc(opts.emptyText || "The first numbers will appear here as they arrive.")}</div></div>`);
  const tip = document.createElement("div"); tip.className = "tip"; el.appendChild(tip);
  const svgEl = el.querySelector("svg"), xh = svgEl.querySelector(".xh"), dots = [...svgEl.querySelectorAll(".xd")];
  if (!reduced) {
    svgEl.querySelectorAll("path.draw").forEach((p) => { const L = p.getTotalLength ? p.getTotalLength() : 0; if (!L) return; p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.getBoundingClientRect(); p.style.transition = "stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"; p.style.strokeDashoffset = "0"; setTimeout(() => { p.style.strokeDasharray = ""; }, 1100); });
    svgEl.querySelectorAll("rect.grow").forEach((r, k) => { r.style.transformOrigin = `0 ${padT + ih}px`; r.style.transform = "scaleY(0)"; r.style.transition = `transform .7s cubic-bezier(.2,.8,.2,1) ${Math.min(k * 12, 300)}ms`; requestAnimationFrame(() => requestAnimationFrame(() => { r.style.transform = "scaleY(1)"; })); });
  }
  const move = (clientX) => {
    if (total === 0) return;
    const r = svgEl.getBoundingClientRect(), x = ((clientX - r.left) / r.width) * W;
    const i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round(((x - padL) / iw) * (n - 1))));
    const cx = X(i);
    xh.setAttribute("x1", cx); xh.setAttribute("x2", cx); xh.setAttribute("opacity", n > 1 ? 1 : 0);
    dots.forEach((d) => { const s = shown[Number(d.dataset.i)]; d.setAttribute("cx", cx); d.setAttribute("cy", Y(s.values[i])); d.setAttribute("opacity", 1); });
    tip.innerHTML = `<div class="d">${fmtDayLong(days[i])}</div>` + shown.map((s) => `<div class="r"><span><i style="width:8px;height:8px;border-radius:2px;display:inline-block;background:${s.color === "grad" ? "linear-gradient(90deg,var(--grad-a),var(--grad-b))" : s.color}"></i>${esc(s.label)}</span><b class="num">${fmt(s.values[i])}</b></div>`).join("");
    tip.classList.add("show");
    const px = (cx / W) * r.width, tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(r.width - tw, px + 14 > r.width - tw ? px - tw - 14 : px + 14)) + "px";
    tip.style.top = "8px";
  };
  const leave = () => { tip.classList.remove("show"); xh.setAttribute("opacity", 0); dots.forEach((d) => d.setAttribute("opacity", 0)); };
  svgEl.addEventListener("pointermove", (e) => move(e.clientX));
  svgEl.addEventListener("pointerdown", (e) => move(e.clientX));
  svgEl.addEventListener("pointerleave", leave);
}

function ringSvg(p, size = 64) {
  const r = (size - 8) / 2, c = 2 * Math.PI * r, v = p == null ? 0 : Math.max(0, Math.min(100, p));
  const id = "rg" + ++gid;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="var(--grad-a)"/><stop offset="1" stop-color="var(--grad-b)"/></linearGradient></defs>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="7"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="7" stroke-linecap="round" transform="rotate(-90 ${size / 2} ${size / 2})"
      stroke-dasharray="${c}" stroke-dashoffset="${c}" class="ringarc" data-to="${c * (1 - v / 100)}"/></svg>`;
}
function animateRings(root) { root.querySelectorAll(".ringarc").forEach((a) => { a.style.transition = reduced ? "none" : "stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)"; requestAnimationFrame(() => requestAnimationFrame(() => { a.style.strokeDashoffset = a.dataset.to; })); }); }
function animateBars(root) { requestAnimationFrame(() => requestAnimationFrame(() => root.querySelectorAll("[data-w]").forEach((b) => { b.style.width = b.dataset.w; }))); }

async function load(force) {
  if (S.loading && !force) return;
  S.loading = true;
  const [from, to] = resolveRange();
  S.from = from; S.to = to;
  document.getElementById("refresh").style.opacity = .5;
  try {
    const d = await rpc("admin_dashboard", { p_token: S.token, p_from: from, p_to: to, p_platform: S.platform || null, p_version: S.version || null, p_include_test: S.test });
    if (!d || d.auth === false) { store.del(TOKEN_KEY); S.token = null; renderLogin("Your session ended. Sign in again."); return; }
    if (!d.ok) throw new Error(d.error || "error");
    const firstLoad = !S.data;
    S.data = d;
    // "All time" needs the first day, known only after the first answer
    if (S.range === "all") { const [f2] = resolveRange(); if (f2 !== from) { S.loading = false; return load(true); } }
    paint(!firstLoad);
    hideBanner();
  } catch (err) {
    showBanner(err.missing ? "The analytics tables are not installed yet — run docs/app-events-migration.sql in Supabase." : "Could not refresh. Showing the last numbers loaded." );
  } finally {
    S.loading = false;
    const r = document.getElementById("refresh"); if (r) r.style.opacity = 1;
  }
}
function showBanner(t) { const b = document.getElementById("banner"); if (b) { b.textContent = t; b.classList.add("show"); } }
function hideBanner() { const b = document.getElementById("banner"); if (b) b.classList.remove("show"); }

  // KPIs

  const arrRate = pct(arr.uses, trips.uses), arrRatePrev = pct(arr.uses_prev, trips.uses_prev);
  const cfu = k.active ? 100 - pct(k.crashed_users, k.active) : null, cfuPrev = k.active_prev ? 100 - pct(k.crashed_users_prev, k.active_prev) : null;

  const sp = (key) => d.daily.map((x) => x[key] || 0);
  const kpis = [
    { label: "Active users", note: "active", value: k.active, prev: k.active_prev, spark: sp("dau") },
    { label: "New users", note: "new_users", value: k.new_users, prev: k.new_users_prev, spark: sp("new") },

    { label: "Crash-free users", note: "crash_free", value: cfu, prev: cfuPrev, pct: true, sub: cfs == null ? "no sessions yet" : `${fmtPct(cfs, 1)} of sessions` },
  ];
  document.getElementById("kpis").innerHTML = kpis.map((x) => {
    const dl = x.value == null ? null : x.pct ? (x.prev == null ? null : (() => { const dd = x.value - x.prev; return Math.abs(dd) < 0.05 ? { cls: "flat", txt: "±0 pts" } : { cls: dd > 0 ? "up" : "down", txt: (dd > 0 ? "+" : "−") + Math.abs(dd).toFixed(1) + " pts" }; })()) : delta(x.value, x.prev);

  }).join("");

  // main chart
  const lg = document.getElementById("lg");
  const SER = [{ key: "dau", label: "Daily", color: "grad" }, { key: "wau", label: "Weekly", color: "var(--accent-2)", dash: true }, { key: "mau", label: "Monthly", color: "var(--faint)", dash: true }, { key: "new", label: "New", color: "#E7A33E" }];

  timeChart(document.getElementById("main"), days, SER.filter((s) => S.series[s.key]).map((s) => ({ ...s, values: sp(s.key) })),
    { height: 260, label: "Active users per day", emptyTitle: "No active users in this range", emptyText: "As soon as a phone opens the app, it shows up here." });

  // moments
  const rec = d.records || {}, ms = rec.milestones || [], total = k.total_users || 0;

  const best = rec.best_day;
  const lastMs = ms.length ? ms[ms.length - 1] : null;
  document.getElementById("moments").innerHTML = `
    <div class="moment ${quiet ? "" : "fade"}"><div class="ic">${icon("users", 18)}</div><div style="flex:1;min-width:0"><div class="t">People who have used RouteMind</div><div class="v">${countSpan(total)}</div>
      <div class="next t">${total ? `${fmt(next - total)} to go until ${fmt(next)}` : "Waiting for the first phone"}</div><div class="bar"><i data-w="${Math.max(3, Math.min(100, ((total - prevMark) / Math.max(1, next - prevMark)) * 100))}%"></i></div></div></div>
    <div class="moment ${quiet ? "" : "fade"}"><div class="ic">${icon("trophy", 18)}</div><div><div class="t">Best day ever</div><div class="v">${best ? `${fmt(best.users)} <span style="font-weight:500;color:var(--muted);font-size:13px">${best.users === 1 ? "person" : "people"} · ${fmtDay(best.day, { day: "numeric", month: "short", year: "numeric" })}</span>` : "—"}</div></div></div>
    <div class="moment ${quiet ? "" : "fade"}"><div class="ic">${icon("flag", 18)}</div><div><div class="t">Latest milestone</div><div class="v">${lastMs ? `${fmt(lastMs.users)} ${lastMs.users === 1 ? "person" : "people"} <span style="font-weight:500;color:var(--muted);font-size:13px">· ${fmtDay(lastMs.day, { day: "numeric", month: "short", year: "numeric" })}</span>` : "Your first user is on the way"}</div></div></div>
    ${rec.first_day ? `<div class="t" style="font-size:12px;color:var(--faint);padding:0 2px">First event ${fmtDay(rec.first_day, { day: "numeric", month: "short", year: "numeric" })} · ${dayDiff(rec.first_day, d.today) + 1} ${dayDiff(rec.first_day, d.today) === 0 ? "day" : "days"} of history</div>` : ""}`;

  // funnel
  const steps = FUNNELS.main.map((key) => ({ key, ...(F[key] || { users: 0, uses: 0 }) }));
  const top = Math.max(1, steps[0].uses, ...steps.map((s) => s.uses));
  document.getElementById("funnel").innerHTML = steps.map((s, i) => {
    const conv = i ? pct(s.uses, steps[i - 1].uses) : null;
    return `${i ? `<div class="conv">${conv == null ? "—" : conv > 100 ? `↑ ${fmtPct(conv)} of the step before (it can also start without it)` : `↓ ${fmtPct(conv)} of the step before`}</div>` : ""}
      <div class="fstep"><div class="fl"><span>${esc(STEP_LABEL[s.key])}</span><span><b class="num">${fmt(s.uses)}</b> <span class="c">· ${fmt(s.users)} ${s.users === 1 ? "person" : "people"}</span></span></div>
      <div class="ftrack"><i data-w="${s.uses ? Math.max(2, (100 * s.uses) / top) : 0}%"></i></div></div>`;
  }).join("");

  // trips chart
  timeChart(document.getElementById("trips"), days, [{ key: "trips", label: "Started", color: "grad", values: sp("trips") }, { key: "arrivals", label: "Arrived", color: "var(--accent-2)", dash: true, values: sp("arrivals") }],
    { height: 220, label: "Trips per day", emptyTitle: "No trips in this range", emptyText: "Trips started on the phone, Android Auto and CarPlay land here." });

  // features
  const groups = ["All", ...new Set(FEATURES.map((f) => f.group))];
  S.fgroup = S.fgroup || "All";
  document.getElementById("fg").innerHTML = groups.map((g) => `<button type="button" data-g="${g}" aria-pressed="${S.fgroup === g}">${g}</button>`).join("");
  document.querySelectorAll("[data-g]").forEach((b) => b.addEventListener("click", () => { S.fgroup = b.dataset.g; paint(true); }));
  const list = FEATURES.filter((f) => S.fgroup === "All" || f.group === S.fgroup).map((f) => ({ ...f, ...(F[f.key] || { users: 0, uses: 0, users_prev: 0, uses_prev: 0 }) }));
  list.sort((a, b) => (S.fgroup === "All" ? b.users - a.users || b.uses - a.uses : 0));
  document.getElementById("feats").innerHTML = list.map((f) => `<button type="button" class="feat ${f.uses ? "" : "zero"}" data-f="${f.key}">
      <div class="h">${icon(f.icon)}<span>${esc(f.label)}</span></div>
      <div class="n"><b class="num">${fmt(f.users)}</b><em>${f.users === 1 ? "person" : "people"}</em></div>
      <div class="n" style="gap:6px"><em>${fmt(f.uses)} ${f.uses === 1 ? "use" : "uses"}</em>${f.uses || f.uses_prev ? deltaHtml(delta(f.uses, f.uses_prev)) : ""}</div></button>`).join("");
  document.querySelectorAll("[data-f]").forEach((b) => b.addEventListener("click", () => openDrawer(b.dataset.f)));

  // retention
  const ret = d.retention || [], rt = d.returning || {};
  const r3 = [["Next day", rt.d1, rt.base_d1], ["Within 7 days", rt.d7, rt.base_d7], ["Within 30 days", rt.d30, rt.base_d30]];
  let rh = `<div class="ret3">${r3.map(([t, a, b]) => `<div class="mini"><div class="t">${t}${t === "Next day" ? infoBtn("returning") : ""}</div><div class="v">${b ? fmtPct(pct(a, b)) : "—"}</div><div class="t">${b ? `${fmt(a)} of ${fmt(b)}` : "not enough time yet"}</div></div>`).join("")}</div>`;
  if (!ret.length) rh += `<div class="empty"><b>No cohorts yet</b>Weekly cohorts appear once people start using the app.</div>`;
  else {
    rh += `<div class="heat"><div class="hr"><div class="hh" style="text-align:left">Week of</div><div class="hh">People</div>${Array.from({ length: 8 }, (_, i) => `<div class="hh">${i === 0 ? "W0" : "W" + i}</div>`).join("")}</div>`;
    rh += ret.map((c) => `<div class="hr"><div class="lab">${fmtDay(c.week)}</div><div class="hh num" style="color:var(--ink-2)">${fmt(c.size)}</div>${Array.from({ length: 8 }, (_, i) => {
      const v = c.weeks[i]; if (v == null) return `<div></div>`;
      const p = c.size ? (100 * v) / c.size : 0, a = 0.08 + 0.72 * (p / 100);
      return `<div class="hc num" title="${fmt(v)} of ${fmt(c.size)}" style="background:rgba(var(--heat),${a.toFixed(3)});color:${p > 55 ? "#fff" : "var(--ink)"}">${Math.round(p)}%</div>`;
    }).join("")}</div>`).join("") + `</div>`;
  }
  document.getElementById("ret").innerHTML = rh;

  // stability
  document.getElementById("stab").innerHTML = `<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
    <div class="ring">${ringSvg(cfu)}<div><div style="color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center">Crash-free users${infoBtn("crash_free")}</div><div style="font-size:20px;font-weight:650" class="num">${fmtPct(cfu, cfu === 100 ? 0 : 1)}</div><div style="font-size:12px;color:var(--muted)">${fmt(k.crashed_users)} of ${fmt(k.active)} had a crash</div></div></div>
    <div class="ring">${ringSvg(cfs)}<div><div style="color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center">Crash-free sessions${infoBtn("crash_sessions")}</div><div style="font-size:20px;font-weight:650" class="num">${fmtPct(cfs, cfs === 100 ? 0 : 1)}</div><div style="font-size:12px;color:var(--muted)">${fmt(k.crashed_sessions)} of ${fmt(k.sessions)} sessions</div></div></div></div>
    <div style="font-size:12px;color:var(--faint);margin-top:12px">Stack traces live in Firebase Crashlytics; this counts the app's own crash reports beside the usage numbers.</div>`;

  // platforms & versions
  const P = d.platforms || [], ptotal = P.reduce((a, b) => a + b.users, 0);
  const PC = { android: "var(--accent-2)", ios: "var(--accent)" };
  const V = (d.versions || []).slice(0, 6), vmax = Math.max(1, ...V.map((v) => v.users));
  document.getElementById("plat").innerHTML = ptotal ? `<div class="split">${P.map((p) => `<i style="width:${(100 * p.users) / ptotal}%;background:${PC[p.platform] || "var(--faint)"}"></i>`).join("")}</div>
    <div class="kv">${P.map((p) => `<div class="k"><i style="background:${PC[p.platform] || "var(--faint)"}"></i>${p.platform === "ios" ? "iOS" : "Android"}</div><div class="num"><b>${fmt(p.users)}</b> <span style="color:var(--muted)">· ${fmtPct(pct(p.users, ptotal))}</span></div>`).join("")}</div>
    <div style="margin-top:16px;font-size:12px;color:var(--muted);font-weight:550">Versions</div>
    <div class="kv" style="margin-top:6px">${V.map((v) => `<div class="k" style="flex-direction:column;align-items:stretch;gap:0"><span>${esc(v.version || "unknown")}</span><div class="vbar" style="width:${(100 * v.users) / vmax}%"></div></div><div class="num">${fmt(v.users)}</div>`).join("")}</div>`
    : `<div class="empty"><b>No users in this range</b>Android and iOS will split here.</div>`;

  // footer
  const last = d.last_event_at ? new Date(d.last_event_at) : null;
  const ago = last ? Math.max(0, Math.round((Date.now() - last.getTime()) / 60000)) : null;
  document.getElementById("foot").innerHTML = `<span>${last ? `Last event received ${ago < 1 ? "just now" : ago < 60 ? ago + " min ago" : ago < 1440 ? Math.round(ago / 60) + " h ago" : Math.round(ago / 1440) + " days ago"}` : "No events received yet"}</span>
    <span>Daily numbers are Cairo days (Africa/Cairo)</span><span>Updated ${new Date(d.generated_at).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}</span>
    <span class="spacer"></span><button class="linkbtn" id="so" type="button">Sign out</button>`;
  document.getElementById("so").addEventListener("click", async () => { try { await rpc("admin_logout", { p_token: S.token }); } catch {} store.del(TOKEN_KEY); S.token = null; S.data = null; renderLogin(); });

  const root = document.querySelector("main");
  if (!quiet) countUp(root); else root.querySelectorAll("[data-count]").forEach((el) => { const v = Number(el.dataset.count), dec = Number(el.dataset.dec || 0); el.firstChild.nodeValue = (dec ? v.toFixed(dec) : fmt(v)) + (el.dataset.suffix || ""); });
  animateBars(root); animateRings(root);
  if (S.drawer) openDrawer(S.drawer, true);
}

// ── drawer: one feature ─────────────────────────────────────────────────────────────────────────────────────────
async function openDrawer(key, refresh) {
  const f = FEATURE[key]; if (!f) return;
  S.drawer = key;
  const dr = document.getElementById("drawer"), sc = document.getElementById("scrim");
  const F = Object.fromEntries((S.data.features || []).map((x) => [x.feature, x])), cur = F[key] || { users: 0, uses: 0, users_prev: 0, uses_prev: 0 };
  dr.innerHTML = `<div class="dh"><span class="mark" style="background:var(--accent-soft);color:var(--accent)">${icon(f.icon, 16)}</span><div style="flex:1;min-width:0"><div style="font-weight:650;font-size:15.5px">${esc(f.label)}</div><div style="font-size:12.5px;color:var(--muted)">${esc(f.note)}</div></div>
    <button class="iconbtn" type="button" id="dx" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="db">
      <div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <div class="mini"><div class="t">People</div><div class="v num">${fmt(cur.users)}</div><div class="meta" style="display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)">${deltaHtml(delta(cur.users, cur.users_prev))}<span>was ${fmt(cur.users_prev)}</span></div></div>
        <div class="mini"><div class="t">Uses</div><div class="v num">${fmt(cur.uses)}</div><div class="meta" style="display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)">${deltaHtml(delta(cur.uses, cur.uses_prev))}<span>was ${fmt(cur.uses_prev)}</span></div></div>
      </div>
      <div class="card panel"><div class="ph"><h2>Daily trend</h2><span class="sub">${fmtDay(S.from)} – ${fmtDay(S.to)}</span></div><div class="chart" id="dchart"><div class="skel" style="height:200px"></div></div></div>
      ${FUNNELS[key] ? `<div class="card panel"><div class="ph"><h2>Its funnel</h2>${infoBtn("funnel")}</div><div class="funnel" id="dfun"></div></div>` : ""}
      <div style="font-size:12px;color:var(--faint)">Share of active users: ${S.data.kpi.active ? fmtPct(pct(cur.users, S.data.kpi.active)) : "—"} · ${cur.users ? (cur.uses / cur.users).toFixed(1) : "0"} uses per person</div>
    </div>`;
  document.getElementById("dx").addEventListener("click", closeDrawer);
  if (!refresh) { sc.classList.add("show"); requestAnimationFrame(() => dr.classList.add("show")); dr.setAttribute("aria-hidden", "false"); }
  if (FUNNELS[key]) {
    const steps = FUNNELS[key].map((k) => ({ key: k, ...(F[k] || { users: 0, uses: 0 }) })), top = Math.max(1, ...steps.map((s) => s.uses));
    document.getElementById("dfun").innerHTML = steps.map((s, i) => `${i ? `<div class="conv">${steps[i - 1].uses ? (s.uses > steps[i - 1].uses ? "↑ " : "↓ ") + fmtPct(pct(s.uses, steps[i - 1].uses)) : "—"}</div>` : ""}<div class="fstep"><div class="fl"><span>${esc(STEP_LABEL[s.key] || FEATURE[s.key].label)}</span><span><b class="num">${fmt(s.uses)}</b> <span class="c">· ${fmt(s.users)} ${s.users === 1 ? "person" : "people"}</span></span></div><div class="ftrack"><i data-w="${s.uses ? Math.max(2, (100 * s.uses) / top) : 0}%"></i></div></div>`).join("");
    animateBars(dr);
  }
  try {
    const r = await rpc("admin_feature", { p_token: S.token, p_feature: key, p_from: S.from, p_to: S.to, p_platform: S.platform || null, p_version: S.version || null, p_include_test: S.test });
    if (S.drawer !== key || !r.ok) return;
    const el = document.getElementById("dchart");
    timeChart(el, r.daily.map((x) => x.day), [{ key: "users", label: "People", color: "grad", values: r.daily.map((x) => x.users) }, { key: "uses", label: "Uses", color: "var(--accent)", type: "bar", values: r.daily.map((x) => x.uses) }],
      { height: 210, label: f.label + " per day", emptyTitle: "Not used in this range", emptyText: "Try a longer range." });
  } catch { const el = document.getElementById("dchart"); if (el) el.innerHTML = `<div class="empty"><b>Could not load the trend</b>Check the connection and try again.</div>`; }
}
function closeDrawer() {
  if (!S.drawer) return;
  S.drawer = null;
  const dr = document.getElementById("drawer"); if (!dr) return;
  dr.classList.remove("show"); dr.setAttribute("aria-hidden", "true"); document.getElementById("scrim").classList.remove("show");
}

// ── boot ────────────────────────────────────────────────────────────────────────────────────────────────────────
function boot() {
  if (!S.token) return renderLogin();
  shell();
  load();
  clearInterval(window.__live);
  window.__live = setInterval(() => { if (document.visibilityState === "visible" && S.token) load(); }, 60000);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.token && S.data) load(); });
boot();
</script>
</body>
</html>
